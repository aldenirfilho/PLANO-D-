  <title id="title">Guardião de um horizonte comum</title>
  <desc id="desc">Arte conceitual original de um guardião humano em voo, com capacete de visor opaco, armadura azul e jaqueta que se abre como uma capa. Uma pequena luz no peito aponta para a esperança. Órbitas, estrelas e um planeta iluminam a cidade e a Terra protegidas abaixo. Sem armas.</desc>
